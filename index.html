<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI TalkMate</title>
<style>
:root{--bg:#eef1fb;--card:#fff;--tx:#1b2150;--sub:#6b7194;--pri:#4a56e2;--soft:#e8ebfd;--ok:#20a46b;--okbg:#e6f6ee;--warn:#e69a1b;--bd:#e2e5f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1230;--card:#1a1e45;--tx:#eef0ff;--sub:#a3a9d6;--soft:#262b63;--bd:#2c3170;--okbg:#14352a}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--card);display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:700}
header .back{border:0;background:none;color:var(--tx);font-size:20px;cursor:pointer}
header .av{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.logo{width:26px;height:22px;background:var(--pri);border-radius:8px;display:inline-grid;place-items:center;color:#fff;font-size:11px}
main{flex:1;padding:4px 16px 16px;overflow-y:auto}
h1{font-size:30px;line-height:1.1;margin:8px 0}h2{font-size:20px;margin:6px 0}
p{color:var(--sub);font-size:14px;line-height:1.5;margin:4px 0}
.btn{width:100%;border:0;background:var(--pri);color:#fff;font-weight:700;padding:14px;border-radius:12px;font-size:15px;cursor:pointer;margin-top:12px}
.btn.sm{width:auto;padding:10px 20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;cursor:pointer;font:inherit}
.topic.on{border-color:var(--pri);background:var(--soft)}
.topic small{display:block;color:var(--sub);font-size:11px}
.ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.hero{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--soft),var(--card));border-radius:18px;padding:14px}
.bot{font-size:70px;text-align:center}
.bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;max-width:85%;margin:8px 0}
.b{background:var(--soft);border-top-left-radius:4px}
.u{background:var(--pri);color:#fff;margin-left:auto;border-top-right-radius:4px}
.row{display:flex;gap:8px;align-items:center}
.inp{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--bd)}
.inp input,textarea{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:14px}
textarea{width:100%;height:110px;resize:none}
.send{border:0;background:var(--pri);color:#fff;width:42px;border-radius:50%;cursor:pointer;font-size:16px}
nav{display:flex;border-top:1px solid var(--bd);padding:8px 0;position:sticky;bottom:0;background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;cursor:pointer;display:grid;gap:2px;justify-items:center}
nav button.on{color:var(--pri);font-weight:700}nav span{font-size:18px}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.t-l{background:var(--okbg);color:var(--ok)}.t-r{background:#fdf1dc;color:var(--warn)}
.spk{border:0;background:none;color:var(--pri);cursor:pointer;font-size:15px}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.good{background:var(--okbg);border-radius:14px;padding:14px}
.good h2{color:var(--ok)}
.tip{background:#fdf6e3;color:#7a5a10;border-radius:12px;padding:10px;font-size:13px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stats b{font-size:22px;display:block}.stats small{color:var(--sub);font-size:11px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.menu{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
</style></head><body><div id="app"></div>
<script>
const T={
campus:{n:"Campus Life",i:"🎓",d:"Study, campus, friends, student life",q:["What is one challenge you face at university?","How do you usually spend your free time on campus?"],w:[["deadline","/ˈdedlaɪn/","batas waktu","I often have several deadlines at university."],["manage","/ˈmænɪdʒ/","mengelola","I need to manage my time better."],["overwhelmed","/ˌoʊvərˈwelmd/","kewalahan","I sometimes feel overwhelmed by my assignments."]]},
daily:{n:"Daily Activities",i:"☀️",d:"Morning routine, weekend, etc.",q:["What does your morning routine look like?","How do you spend your weekend?"],w:[["routine","/ruːˈtiːn/","rutinitas","My morning routine starts at five."],["commute","/kəˈmjuːt/","perjalanan pulang-pergi","My commute to campus takes thirty minutes."],["schedule","/ˈskedʒuːl/","jadwal","I have a busy schedule on Mondays."]]},
hobby:{n:"Hobbies & Interests",i:"❤️",d:"Books, music, sports, travel, etc.",q:["What hobby do you enjoy the most?","Who introduced you to that hobby?"],w:[["hobby","/ˈhɑːbi/","hobi","Reading is my favorite hobby."],["passionate","/ˈpæʃənət/","bersemangat","I am passionate about music."],["relax","/rɪˈlæks/","bersantai","I relax by listening to songs."]]},
job:{n:"Job Interview",i:"💼",d:"Career, skills, workplace",q:["Can you tell me about yourself?","What are your biggest strengths?"],w:[["experience","/ɪkˈspɪriəns/","pengalaman","I have experience in teaching English."],["strength","/streŋθ/","kekuatan","My strength is communication."],["qualified","/ˈkwɑːlɪfaɪd/","memenuhi syarat","I am qualified for this position."]]},
travel:{n:"Travel",i:"✈️",d:"Places, culture, experiences",q:["Where would you like to travel next?","What do you want to learn from other cultures?"],w:[["destination","/ˌdestɪˈneɪʃn/","tujuan","Bali is a popular destination."],["explore","/ɪkˈsplɔːr/","menjelajahi","I want to explore new cities."],["culture","/ˈkʌltʃər/","budaya","I love learning about local culture."]]},
food:{n:"Food & Lifestyle",i:"🍴",d:"Food, health, life balance",q:["What do you usually eat for lunch?","How do you keep a healthy lifestyle?"],w:[["nutritious","/nuˈtrɪʃəs/","bergizi","I try to eat nutritious meals."],["balance","/ˈbæləns/","keseimbangan","I need a balance between study and rest."],["crave","/kreɪv/","sangat menginginkan","I crave fried rice at night."]]}
};
const S={v:"home",topic:"campus",qi:0,chat:[],word:null,tab:"All",fb:null,known:{deadline:1,manage:1,challenge:0},days:3,detail:null};
// seed bank like the design
const extra={challenge:["/ˈtʃælɪndʒ/","tantangan","Time management is a big challenge."]};
const RAW=[
["Speech & Gestures","Hesitate|ragu-ragu;Mutter|bergumam;Grumble|menggerutu;Stumble|tersandung / terbata-bata;Wander|berkeliaran;Glance|melirik sekilas;Stare|menatap lekat;Glimpse|melihat sekilas;Whisper|berbisik;Sigh|menghela napas;Fidget|gelisah sambil bergerak;Shrug|mengangkat bahu;Nod|mengangguk;Frown|mengerutkan dahi;Giggle|tertawa kecil;Blurt|mengucapkan sesuatu secara spontan;Ramble|berbicara panjang lebar tanpa arah;Interrupt|menyela pembicaraan;Mishear|salah mendengar;Overhear|tidak sengaja mendengar"],
["Emotions","Apprehensive|cemas akan sesuatu;Reluctant|enggan;Bewildered|sangat kebingungan;Frustrated|frustrasi;Overwhelmed|merasa kewalahan;Uneasy|tidak tenang;Resentful|menyimpan rasa kesal;Envious|iri terhadap orang lain;Grumpy|uring-uringan;Melancholy|sedih dan murung;Elated|sangat gembira;Content|merasa puas;Nostalgic|rindu pada masa lalu;Mortified|sangat malu;Perplexed|bingung;Irritated|jengkel;Relieved|merasa lega;Sheepish|malu karena merasa bersalah;Gloomy|muram;Fidgety|gelisah dan sulit diam"],
["Personality","Meticulous|sangat teliti;Impulsive|bertindak tanpa berpikir panjang;Stubborn|keras kepala;Candid|terus terang;Tactful|bijaksana dalam berbicara;Witty|cerdas dan lucu dalam berbicara;Naive|polos / mudah percaya;Conceited|sombong;Humble|rendah hati;Assertive|tegas dalam menyampaikan pendapat;Aloof|menjaga jarak;Diligent|rajin;Reckless|ceroboh tanpa memikirkan risiko;Cunning|licik;Compassionate|penuh belas kasih;Empathetic|mampu memahami perasaan orang lain;Gregarious|senang bergaul;Reserved|cenderung pendiam;Inquisitive|sangat ingin tahu;Dependable|dapat diandalkan"],
["Everyday Verbs","Linger|berlama-lama;Dwindle|berkurang secara bertahap;Evade|menghindari;Baffle|membingungkan;Convey|menyampaikan;Retrieve|mengambil kembali;Refrain|menahan diri untuk tidak melakukan sesuatu;Scrutinize|memeriksa dengan saksama;Compel|memaksa;Discard|membuang;Grasp|memahami / menggenggam;Defer|menunda;Hinder|menghambat;Prompt|mendorong / memicu;Reconcile|berdamai / memperbaiki hubungan;Overlook|tidak menyadari / mengabaikan;Endure|bertahan menghadapi sesuatu;Ponder|memikirkan secara mendalam"],
["Academic","Acknowledge|mengakui;Plagiarism|plagiarisme / penjiplakan;Citation|sitasi / kutipan sumber;Discrepancy|ketidaksesuaian;Rationale|alasan yang mendasari;Prerequisite|persyaratan awal;Proficiency|tingkat kemahiran;Comprehension|pemahaman;Synthesis|penggabungan gagasan;Hypothesis|hipotesis;Implication|implikasi / dampak lanjutan;Limitation|keterbatasan;Feasibility|kelayakan;Ambiguity|ketaksaan / makna ganda;Corroborate|memperkuat dengan bukti;Substantiate|membuktikan dengan bukti;Elucidate|menjelaskan agar lebih jelas;Articulate|mengungkapkan dengan jelas;Contention|pendapat yang diperdebatkan;Scrutiny|pemeriksaan kritis;Synthesize|menggabungkan informasi menjadi pemahaman baru"],
["Informal","Bummer|hal yang mengecewakan;Awkward|canggung;Sketchy|mencurigakan / tidak meyakinkan;Clueless|tidak tahu apa-apa tentang sesuatu;Nifty|bagus dan praktis;Quirky|unik dengan cara yang menarik;Fussy|rewel / banyak tuntutan;Dodgy|meragukan / mencurigakan;Messy|berantakan / rumit;Tricky|sulit atau menjebak;Hectic|sangat sibuk;Picky|pilih-pilih;Cheesy|klise atau terlalu sentimental;Lousy|buruk / tidak berkualitas;Snug|nyaman dan pas;Dreadful|sangat buruk;Tidy|rapi;Swamped|sangat kewalahan dengan pekerjaan;Rattled|gugup atau terguncang;Fuss|keributan karena hal kecil"],
["Communication","Persuade|membujuk;Negotiate|bernegosiasi;Clarify|memperjelas;Elaborate|menjelaskan lebih terperinci;Reiterate|menyatakan kembali;Disclose|mengungkapkan informasi;Imply|menyiratkan;Assert|menegaskan;Contradict|membantah / bertentangan;Dismiss|menolak / mengabaikan;Reassure|meyakinkan agar merasa tenang;Confide|menceritakan rahasia kepada seseorang;Confront|menghadapi secara langsung;Mediate|menengahi;Intervene|turun tangan;Speculate|berspekulasi;Misinterpret|salah menafsirkan;Paraphrase|mengungkapkan kembali dengan kata berbeda;Summarize|merangkum"],
["Descriptive Adjectives","Tedious|membosankan karena terlalu lama;Exquisite|sangat indah;Subtle|halus / tidak langsung terlihat;Vivid|jelas dan hidup;Peculiar|aneh / tidak biasa;Mundane|biasa dan monoton;Intricate|rumit dengan banyak detail;Fragile|rapuh;Resilient|tangguh;Fleeting|berlangsung sangat singkat;Vast|sangat luas;Scarce|langka / terbatas;Abundant|melimpah;Obscure|tidak jelas / kurang dikenal;Plausible|masuk akal;Inevitable|tidak dapat dihindari;Erratic|tidak menentu;Intriguing|menarik dan membuat penasaran"],
["Problem Solving","Assess|menilai;Deduce|menyimpulkan berdasarkan bukti;Infer|menarik kesimpulan tidak langsung;Discern|membedakan atau mengenali;Diagnose|mengidentifikasi penyebab masalah;Rectify|memperbaiki kesalahan;Mitigate|mengurangi dampak buruk;Alleviate|meringankan;Resolve|menyelesaikan;Anticipate|mengantisipasi;Devise|merancang cara atau solusi;Implement|menerapkan;Optimize|mengoptimalkan;Refine|menyempurnakan;Adapt|menyesuaikan diri;Justify|memberikan alasan yang mendukung;Validate|memvalidasi;Evaluate|mengevaluasi;Prioritize|menentukan prioritas;Reconsider|mempertimbangkan kembali"],
["Phrasal Verbs & Idioms","By all means|tentu saja / silakan;Come across|menemukan secara tidak sengaja;Brush off|mengabaikan / menepis;Bring up|mengangkat suatu topik;Figure out|memahami / menemukan solusi;Run into|bertemu atau mengalami secara tidak sengaja;Put up with|menoleransi;Back down|mengalah;Speak up|berbicara lebih lantang / menyuarakan pendapat;Slip up|melakukan kesalahan kecil;Crack down on|menindak tegas;Zone out|kehilangan fokus;Chime in|ikut menyampaikan pendapat;Blurt out|mengucapkan sesuatu tanpa berpikir;Get carried away|terbawa suasana;Let down|mengecewakan;Hold back|menahan diri;Sort out|membereskan / menyelesaikan masalah;Catch on|mulai memahami;Wind down|bersantai setelah beraktivitas"]];
const LIB=RAW.map(([n,s])=>({n,w:s.split(";").map(x=>x.split("|"))}));
const $=s=>document.querySelector(s),app=$("#app");
const go=v=>{S.v=v;render()};
const say=w=>{try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";speechSynthesis.speak(u)}catch(e){}};
const allW=()=>{const o={};Object.values(T).forEach(t=>t.w.forEach(w=>o[w[0]]=w));Object.entries(extra).forEach(([k,v])=>o[k]=[k,...v]);LIB.forEach(c=>c.w.forEach(x=>{const k=x[0].toLowerCase();if(!o[k])o[k]=[k,"",x[1],""]}));return o};
const learned=()=>Object.values(S.known).filter(x=>x==1).length;
const head=(back,t)=>`<header>${back?`<button class="back" onclick="go('${back}')">‹</button>`:""}<span class="logo">AI</span>${t||"AI TalkMate"}<span class="av">🧑</span></header>`;
const nav=a=>`<nav>${[["home","🏠","Home"],["chat","💬","Chat"],["bank","📘","Vocabulary"],["profile","👤","Profile"]].map(x=>`<button class="${a==x[0]?"on":""}" onclick="${x[0]=="chat"?"startChat()":`go('${x[0]}')`}"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`;
function startChat(){const t=T[S.topic];S.qi=0;S.chat=[{b:t.q[0]}];go("chat")}
function pick(k){S.topic=k;render()}
function topicBtn(k,sel){const t=T[k];return `<button class="topic ${sel&&S.topic==k?"on":""}" onclick="${sel?`pick('${k}')`:`S.topic='${k}';startChat()`}"><span class="ic">${t.i}</span><span><b style="font-size:13px">${t.n}</b>${sel?`<small>${t.d}</small>`:""}</span></button>`}
function wordCard(w,click){const k=S.known[w[0]];return `<div class="card" ${click?`onclick="S.detail='${w[0]}';S.from=S.v=='library'?'library':'bank';go('detail')" style="cursor:pointer"`:""}><div class="row"><span class="ic">💼</span><div style="flex:1"><b>${w[0]}</b> <button class="spk" onclick="event.stopPropagation();say('${w[0]}')">🔊</button><p>${w[1]?w[1]+"<br>":""}${w[2]}</p>${click||!w[3]?"":`<p>${w[3]}</p>`}</div>${click&&k!==undefined?`<span class="tag ${k==1?"t-l":"t-r"}">${k==1?"Learned":"To Review"}</span>`:""}</div></div>`}
const V={
home:()=>head()+`<main><div class="hero"><div style="flex:1"><h1>Better Vocabulary, Brighter Conversations</h1><p>AI TalkMate helps you find the right words, build your confidence, and speak English more naturally.</p><button class="btn sm" onclick="go('topics')">Start Learning</button></div><div class="bot">🤖</div></div><div class="row" style="justify-content:space-between;margin-top:16px"><b>Popular Topics</b><small style="color:var(--pri);cursor:pointer" onclick="go('topics')">See all</small></div><div class="grid" style="margin-top:8px">${["campus","daily","hobby","job"].map(k=>topicBtn(k)).join("")}</div></main>`+nav("home"),
topics:()=>head("home")+`<main><h2>Choose a Topic</h2><p>Pick a topic you're interested in. It will help us have a more natural conversation.</p><div class="grid" style="margin-top:12px">${Object.keys(T).map(k=>topicBtn(k,1)).join("")}</div><button class="btn" onclick="startChat()">Next</button></main>`,
chat:()=>{const t=T[S.topic];const last=S.chat[S.chat.length-1];return head("topics")+`<main>${S.chat.length==1?`<div class="card" style="text-align:center"><div class="bot" style="font-size:54px">🤖</div><p>Let's talk about <b>${t.n}</b>. I'll ask you some questions, and we'll learn new vocabulary together.</p></div>`:""}${S.chat.map(m=>m.u?`<div class="bubble u">${esc(m.u)}</div>`:m.sup?`<div class="bubble b">Thanks for sharing! Here are some useful words that can help you express your idea more clearly and naturally.<br><button class="btn sm" onclick="go('support')">See Vocabulary</button></div>`:`<div class="bubble b">${m.b}</div>`).join("")}</main><div class="inp"><input id="msg" placeholder="Type your answer here..." onkeydown="if(event.key=='Enter')send()"><button class="send" onclick="mic()" title="Speak">🎤</button><button class="send" onclick="send()">➤</button></div>`},
support:()=>head("chat")+`<main><h2>Vocabulary Support</h2><p>Here are some useful words and phrases related to your answer.</p>${T[S.topic].w.map(w=>wordCard(w)).join("")}<button class="btn" onclick="S.pf=0;S.word=T[S.topic].w[2];S.fb=null;go('practice')">Practice Now</button></main>`,
practice:()=>head(S.pf?"detail":"support")+`<main><h2>✏️ Your Turn!</h2><p>Now, try to make your own sentence using the word "<b>${S.word[0]}</b>".</p><textarea id="sent" maxlength="100" placeholder="Type your sentence here..." oninput="$('#cnt').textContent=this.value.length+'/100'" style="margin-top:12px"></textarea><p id="cnt" style="text-align:right">0/100</p><button class="btn" onclick="submitS()">Submit</button><div class="tip">💡 <b>Tip:</b> You can use the word at the beginning, middle, or end of your sentence.</div></main>`,
feedback:()=>{const f=S.fb;return head("practice")+`<main>${f.ok?`<div class="good"><h2>✅ Great job!</h2><p>Your sentence is correct and natural.</p><p style="color:var(--tx)">"${esc(f.s)}"</p></div>`:`<div class="card"><h2 style="color:var(--warn)">Almost there!</h2><p>${f.msg}</p><p style="color:var(--tx)">"${esc(f.s)}"</p></div>`}<div class="card"><b>Feedback</b><p>${f.ok?"You can also try to add a little more detail, like when or why you feel "+S.word[0]+".":"Try again and include the word in a complete sentence."}</p><div class="card" style="background:var(--soft)"><b>Example:</b><p>${S.word[3]?'"'+S.word[3]+'"':"Meaning: "+S.word[2]}</p></div></div><button class="btn" onclick="${f.ok?"cont()":"go('practice')"}">${f.ok?"Continue":"Try Again"}</button></main>`},
bank:()=>{const a=allW(),keys=Object.keys(a).filter(k=>S.known[k]!==undefined&&(S.tab=="All"||(S.tab=="Learned"?S.known[k]==1:S.known[k]==0)));return head()+`<main><h2>My Vocabulary Bank</h2><p>Your learned words will be saved here. Keep practicing to remember them!</p><button class="btn" style="margin:8px 0 0" onclick="S.cat=0;S.q='';go('library')">📚 Browse Word Library</button><div class="tabs">${["All","Learned","To Review"].map(t=>`<button class="${S.tab==t?"on":""}" onclick="S.tab='${t}';render()">${t}</button>`).join("")}</div>${keys.map(k=>wordCard(a[k],1)).join("")||"<p>No words yet.</p>"}</main>`+nav("bank")},
detail:()=>{const w=allW()[S.detail],k=S.known[w[0]];return head(S.from||"bank","Word Details")+`<main><div class="card"><div class="row"><h2 style="flex:1">${w[0]} <button class="spk" onclick="say('${w[0]}')">🔊</button></h2>${k===undefined?"":`<span class="tag ${k==1?"t-l":"t-r"}">${k==1?"Learned":"To Review"}</span>`}</div>${w[1]?`<p>${w[1]}</p>`:""}<p><b>Meaning</b><br>${w[2]}</p>${w[3]?`<p><b>Example Sentence</b><br>${w[3]}</p>`:""}</div>${k===undefined?`<button class="btn" style="background:var(--soft);color:var(--pri)" onclick="S.known['${w[0]}']=0;render()">Add to Vocabulary Bank</button>`:""}<button class="btn" onclick="S.pf=1;S.word=allW()['${w[0]}'];S.fb=null;go('practice')">Add to Practice</button></main>`},
profile:()=>{const n=learned();return head()+`<main><div class="row" style="margin:8px 0"><span class="ic" style="width:60px;height:60px;font-size:30px">🧑</span><div style="flex:1"><b>Desta Aulia</b><p>Level ${lvl()} • ${n} words learned</p><div class="bar"><i style="width:${Math.min(100,n/24*100)}%"></i></div></div></div>${[["📘","My Vocabulary Bank","bank"],["📈","Learning Progress","progress"],["⚙️","Settings","profile"],["❓","Help & Support","profile"],["↪️","Log Out","home"]].map(m=>`<div class="menu" onclick="go('${m[2]}')"><span>${m[0]} ${m[1]}</span><span>›</span></div>`).join("")}</main>`+nav("profile")},
library:()=>head("bank","Word Library")+`<main><h2>Word Library</h2><p>${new Set(LIB.flatMap(c=>c.w.map(x=>x[0].toLowerCase()))).size} words and phrases. Tap a word to see details, then add it to your bank or practice it.</p><input id="q" placeholder="Search word or meaning..." value="${esc(S.q||"")}" oninput="S.q=this.value;$('#ll').innerHTML=libList()" style="width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;margin:8px 0;font:inherit"><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px">${["All",...LIB.map(c=>c.n)].map((n,i)=>`<button class="tag" style="border:0;cursor:pointer;white-space:nowrap;${(S.cat||0)==i?"background:var(--pri);color:#fff":"background:var(--soft);color:var(--pri)"}" onclick="S.cat=${i};render()">${n}</button>`).join("")}</div><div id="ll">${libList()}</div></main>`,
progress:()=>{const n=learned(),pts=[2,4,5,8,11,15,n+17>24?24:n+17];const mx=30,P=pts.map((v,i)=>`${30+i*45},${120-v/mx*110}`).join(" ");return head("profile")+`<main><h2>Learning Progress</h2><p>Track your progress and see how much you've improved.</p><div class="stats" style="margin:12px 0"><div><b>${n+22}</b><small>words learned</small></div><div><b>${S.days}</b><small>days streak</small></div><div><b>Lv ${lvl()}</b><small>Beginner</small></div></div><b>Vocabulary Growth</b><svg viewBox="0 0 320 140" style="width:100%"><g stroke="var(--bd)">${[10,45,80,120].map(y=>`<line x1="25" x2="310" y1="${y}" y2="${y}"/>`).join("")}</g><polyline points="${P}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>${P.split(" ").map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="3.5" fill="var(--pri)"/>`).join("")}<g fill="var(--sub)" font-size="9">${["Oct 1","Oct 3","Oct 5","Oct 7","Oct 9"].map((d,i)=>`<text x="${22+i*70}" y="136">${d}</text>`).join("")}</g></svg></main>`}
};
const lvl=()=>1+Math.floor(learned()/3);
function libList(){const A=allW(),q=(S.q||"").toLowerCase(),c=S.cat||0,seen={};return LIB.filter((x,i)=>!c||i==c-1).flatMap(x=>x.w).map(x=>x[0].toLowerCase()).filter(k=>!seen[k]&&(seen[k]=1)&&(!q||k.includes(q)||A[k][2].toLowerCase().includes(q))).map(k=>wordCard(A[k],1)).join("")||"<p>No words found.</p>"}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function send(){const el=$("#msg"),v=el.value.trim();if(!v)return;S.chat.push({u:v},{sup:1});S.word=T[S.topic].w[2];render();$("main").scrollTop=1e5}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Speech recognition is not supported in this browser.");const r=new R();r.lang="en-US";r.onresult=e=>{$("#msg").value=e.results[0][0].transcript};r.start()}
function submitS(){const s=$("#sent").value.trim(),w=S.word[0];const has=new RegExp("\\b"+w+"\\b","i").test(s),len=s.split(/\s+/).filter(Boolean).length;
if(!s)return;S.fb=has&&len>=4?{ok:1,s}:{ok:0,s,msg:!has?`Your sentence does not contain the word "${w}".`:"Your sentence is a bit short. Try to write a complete sentence."};go("feedback")}
function cont(){S.known[S.word[0]]=1;if(S.pf){S.pf=0;return go("bank")}const t=T[S.topic];S.qi=(S.qi+1)%t.q.length;S.chat.push({b:t.q[S.qi]});go("chat")}
function render(){app.innerHTML=V[S.v]();const m=$("#msg");if(m)m.focus()}
render();
</script></body></html>
